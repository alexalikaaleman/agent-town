<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="data:,">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Agent Town</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="topbar">
    <button type="button" id="history-btn">History</button>
    <button type="button" id="needs-btn" aria-expanded="false" aria-controls="needs">Needs Alex <b id="needs-count">0</b></button>
    <p id="summary" class="sr">Loading the castle.</p>
  </header>
  <div id="chiprow">
    <div id="filters" role="toolbar" aria-label="Show only these bots"></div>
    <form id="search-form" role="search" autocomplete="off">
      <input id="search" type="search" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Find a bot" aria-label="Find a bot" enterkeyhint="search">
    </form>
  </div>
  <p id="mode-note"></p>
  <div id="needs" hidden></div>
  <div id="scene-bar" hidden><button id="vault-back" type="button">&#8592; Back to castle</button><span>Treasure Vault</span></div>
  <div id="viewport">
    <div id="stage">
      <div id="fade" aria-hidden="true"></div>
      <div id="map-wrap">
        <canvas id="town" width="800" height="576" aria-label="Agent Town castle map"></canvas>
      </div>
    </div>
    <div id="zoom-controls">
      <button type="button" id="zoom-in" aria-label="Zoom in">+</button>
      <button type="button" id="zoom-out" aria-label="Zoom out">−</button>
      <button type="button" id="label-size" aria-label="Label size" title="Label size">Aa</button>
    </div>
  </div>
  <footer id="strip">
    <div class="counts" role="status">
      <span id="c-work" class="count">Working 0</span>
      <span id="c-wait" class="count">Waiting 0</span>
      <span id="c-block" class="count">Blocked 0</span>
      <span id="c-alex" class="count alex">Needs Alex 0</span>
    </div>
    <p id="clock" class="clock">—</p>
    <p id="mode" class="mode loading" aria-live="polite">Loading…</p>
    <div id="usage-row">
      <div id="usage" title="Weekly usage. Line at 58%: no new steps. Line at 65%: hard stop.">
        <div id="usage-fill"></div>
        <span class="cap soft" style="left:58%"></span>
        <span class="cap hard" style="left:65%"></span>
      </div>
      <span id="usage-text">Usage —</span>
    </div>
  </footer>
  <aside id="history" hidden>
    <div class="history-head"><strong>This month</strong><button type="button" id="history-close">Close</button></div>
    <ul id="history-list"></ul>
  </aside>
  <aside id="panel" hidden>
    <div class="panel-card">
      <button type="button" id="panel-close" aria-label="Back to the map">← Back</button>
      <h2 id="p-name"></h2>
      <p id="p-role"></p>
      <p class="panel-row"><span id="p-state" class="tag"></span> <span id="p-need"></span></p>
      <p id="p-task"></p>
      <p id="p-drive"></p>
      <p id="p-time"></p>
      <p id="p-home"></p>
    </div>
  </aside>
  <main id="list-view" hidden>
    <ul id="bot-list"></ul>
  </main>
  <p id="fatal" class="fatal" hidden></p>
  <script src="js/model.js"></script>
  <script src="js/clock.js"></script>
  <script src="js/world.js"></script>
  <script src="js/path.js"></script>
  <script src="js/agents.js"></script>
  <script src="js/draw.js"></script>
  <!-- castle parts (each one can be removed on its own) -->
  <script src="js/castle-bedrooms.js"></script>
  <script src="js/castle-throne.js"></script>
  <script src="js/castle-siderooms.js"></script>
  <script src="js/castle-battlefield.js"></script>
  <script src="js/castle-lineup.js"></script>
  <script src="js/castle-vault.js"></script>
  <script src="js/net.js"></script>
  <script src="js/list.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
